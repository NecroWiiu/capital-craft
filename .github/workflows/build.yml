name: Build CapitalCraft
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: capitalcraft-1.20.1
          path: build/libs/*.jar
